<div class="relative flex justify-center items-center h-full w-full bg-base-200">
  <div class="absolute top-2 left-2 sm:top-6 sm:left-6">
    <button
      routerLink='/dashboard'
      class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-lg bg-base-100 border border-base-300 text-base-content shadow-sm hover:bg-base-300/50">
      Dashboard
    </button>
  </div>
  <div class="card w-full max-w-md bg-base-100 border border-base-300/60 text-base-content shadow-sm">
    <form [formGroup]="formGroup" class="card-body p-6" (ngSubmit)="onSubmit()">

      <h2 class="text-2xl font-bold text-center mb-4 text-base-content">Add New Timesheet</h2>

      @if (errorMessage()) {
        <div role="alert" class="alert mb-4 bg-error/20 border border-error/40 text-base-content rounded-box shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-error" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
          <span class="text-base-content font-medium">{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-control flex flex-row items-center gap-4">
        <label class="label w-1/4 justify-start p-0" for="date">
          <span class="label-text text-base-content font-medium">Date</span>
        </label>
        <input formControlName="date" type="date"
               class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
        />
      </div>

      <div class="form-control flex flex-row items-center gap-4 mt-4">
        <label class="label w-1/4 justify-start p-0" for="startTime">
          <span class="label-text text-base-content font-medium">Start Time</span>
        </label>
        <input formControlName="startTime" type="time"
               class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
        />
      </div>

      <div class="form-control flex flex-row items-center gap-4 mt-4">
        <label class="label w-1/4 justify-start p-0" for="endTime">
          <span class="label-text text-base-content font-medium">End Time</span>
        </label>
        <input formControlName="endTime" type="time"
               class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
        />
      </div>

      <div class="form-control flex flex-row items-center gap-4 mt-4">
        <label class="label w-1/4 justify-start p-0" for="description">
          <span class="label-text text-base-content font-medium">Description</span>
        </label>
        <input formControlName="description" placeholder="Short description"
               class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
        />
      </div>

      <div class="form-control flex flex-row items-center gap-4 mt-4">
        <label class="label w-1/4 justify-start p-0" for="project">
          <span class="label-text text-base-content font-medium">Project</span>
        </label>
        <div class="dropdown w-3/4">
          <input
            #projectInput
            tabindex="0"
            type="text"
            placeholder="Search for projects"
            class="input input-bordered border-base-300 focus:border-primary w-full bg-base-100 text-base-content shadow-sm"
            (input)="onSearch($event)"
          />
          <ul tabindex="-1" class="dropdown-content menu bg-base-100 border border-base-300 rounded-box z-1 w-full p-2 shadow-lg mt-1">
            @for (project of projects(); track project.id) {
              <li>
                <a class="text-base-content hover:bg-base-300/40" (click)="onSelectedProject(project)">{{ project.name }}</a>
              </li>
            }
            @empty {
              <li><a class="opacity-50 text-base-content pointer-events-none">Results not found</a></li>
            }
          </ul>
        </div>
      </div>

      <div class="form-control mt-6">
        <button
          type="submit"
          class="w-full btn btn-accent shadow-sm transition-all duration-300 px-8 font-semibold"
          [disabled]="formGroup.invalid"
        >
          Save
        </button>
      </div>

    </form>
  </div>
</div>
