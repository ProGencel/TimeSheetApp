<div class="flex justify-center items-center h-full w-full bg-base-200">
  <div class="card w-full max-w-md bg-base-100 border border-base-300/60 text-base-content shadow-sm">
    <form class="card-body p-6" (ngSubmit)="onLogin()" #loginForm="ngForm">

      <h2 class="text-2xl font-bold text-center mb-4 text-base-content">Login</h2>

      @if (errorMessage()) {
        <div role="alert" class="alert mb-4 bg-error/20 border border-error/40 text-base-content rounded-box shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-error" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
          <span class="text-base-content font-medium">{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-control flex flex-row items-center gap-4">
        <label class="label w-1/4 justify-start p-0" for="username">
          <span class="label-text text-base-content font-medium">Username</span>
        </label>
        <input
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Example"
          class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
          required
          #usernameCtrl="ngModel"
        />
      </div>

      <div class="form-control flex flex-row items-center gap-4 mt-4">
        <label class="label w-1/4 justify-start p-0" for="password">
          <span class="label-text text-base-content font-medium">Password</span>
        </label>
        <input
          id="password"
          name="password"
          [(ngModel)]="password"
          type="password"
          placeholder="••••••••"
          class="input input-bordered border-base-300 focus:border-primary w-3/4 bg-base-100 text-base-content shadow-sm"
          required
          #passwordCtrl="ngModel"
        />
      </div>

      <div class="form-control mt-6">
        <button
          type="submit"
          class="w-full btn btn-accent shadow-sm transition-all duration-300 px-8 font-semibold"
          [disabled]="loginForm.invalid"
        >
          Login
        </button>

        <p class="text-sm text-base-content/70 text-center mt-4">
          Don't have an account?
          <a routerLink="/register" class="link link-hover text-accent font-semibold ml-1">
            Sign up.
          </a>
        </p>
      </div>

    </form>
  </div>
</div>
