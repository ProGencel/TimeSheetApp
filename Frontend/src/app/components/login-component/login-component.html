<div class="card w-full max-w-md backdrop-blur-md shadow-2xl">
  <form class="card-body">
    <h2 class="text-2xl font-bold text-center mb-4">Login</h2>

    <div class="form-control">
      <label class="label">
        <span class="label-text ">Username</span>
      </label>
      <input name="username" [(ngModel)]="username" placeholder="Example" class="input input-bordered bg-black/20 backdrop-blur-2xl" required />
    </div>

    <div class="form-control mt-2">
      <label class="label">
        <span class="label-text">Password</span>
      </label>
      <input name="password" [(ngModel)]="password" type="password" placeholder="••••••••" class="input input-bordered bg-black/20 backdrop-blur-2xl" required />
    </div>

    <div class="form-control mt-6">
      <button (click)="onLogin()" class="w-full btn bg-base-100/40 backdrop-blur-md border border-accent/40 text-accent hover:bg-accent hover:text-accent-content hover:border-accent transition-all duration-300 px-8 font-semibold">Login</button>

      <p class="text-sm text-base-content/70 text-center mt-4">
        Don't have an account?
        <a href="/register" class="link link-hover text-accent font-semibold ml-1">
          Sign up.
        </a>
      </p>
    </div>
  </form>
</div>
