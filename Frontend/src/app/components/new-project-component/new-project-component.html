<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" (click)="onClose()">
  <div class="card bg-primary border border-primary/30 border-t-4 border-t-primary text-base-content shadow-2xl rounded-box w-full max-w-md"
       (click)="$event.stopPropagation()">
    <div class="card-body p-6 gap-4 relative">
      <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <div class="flex items-start justify-between">
          <h2 class="text-xl font-bold leading-tight tracking-tight pr-6">New project</h2>

          @if (errorMessage()) {
            <div role="alert" class="alert mb-4 bg-error/50 backdrop-blur-sm border border-error/30 text-error">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
              </svg>
              <span class="text-error-content/90">{{ errorMessage() }}</span>
            </div>
          }

          <button
            class="btn btn-ghost btn-xs btn-circle absolute right-0 top-0"
            (click)="onClose()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="form-control w-full gap-1.5">
          <label class="label py-0" for="project-name">
            <span class="label-text font-medium">Project name</span>
          </label>
          <input
            formControlName="name"
            id="project-name"
            type="text"
            placeholder="e.g. Marketing website redesign"
            class="input input-bordered border-primary/30 focus:border-primary w-full bg-base-100/70" />
        </div>

        <div class="form-control w-full gap-1.5">
          <label class="label py-0" for="project-description">
            <span class="label-text font-medium">Description</span>
          </label>
          <textarea
            formControlName="description"
            id="project-description"
            placeholder="What is this project about?"
            rows="4"
            class="textarea textarea-bordered border-primary/30 focus:border-primary w-full bg-base-100/70 resize-none"></textarea>
        </div>

        <div class="divider my-0 opacity-20"></div>

        <div class="flex items-center justify-end gap-2">
          <button class="btn btn-ghost" (click)="onClose()">
            Cancel
          </button>
          <button class="btn btn-primary" >
            Save project
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
